
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آنچه بیرون قاب ماند — محمدرضا هادیان</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111213;
    color: #eeeeee;
    font-family: Tahoma, Arial, sans-serif;
    transition: background 0.3s ease, color 0.3s ease;
}

body.light {
    background: #e9e7e2;
    color: #171717;
}

a {
    color: inherit;
    text-decoration: none;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 7%;
    border-bottom: 1px solid #8885;
    gap: 16px;
}

header .controls {
    display: flex;
    gap: 10px;
}

button {
    background: none;
    border: 1px solid currentColor;
    color: inherit;
    padding: 10px 15px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s ease;
}

button:hover {
    opacity: 0.65;
}

main {
    max-width: 1150px;
    margin: auto;
    padding: 85px 7%;
}

h1 {
    font-weight: 400;
    font-size: clamp(34px, 6vw, 76px);
    margin: 18px 0 26px;
}

.kicker {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.65;
}

.intro {
    line-height: 2.2;
    max-width: 670px;
    opacity: 0.8;
    font-size: 14px;
    white-space: pre-line;
}

.gallery {
    margin-top: 90px;
    display: grid;
    gap: 75px;
}

.frame {
    padding: clamp(18px, 5vw, 65px);
    background: #f9f9f7;
    color: #444;
    min-height: 380px;
    display: grid;
    place-items: center;
    text-align: center;
    transition: background 0.3s ease, color 0.3s ease;
}

.frame:nth-child(2) {
    background: #292929;
    color: #ddd;
}

.frame:nth-child(3) {
    background: #d0d0ce;
    color: #444;
}

.frame p {
    font-size: 13px;
    line-height: 2;
    opacity: 0.7;
}

.frame img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
}

footer {
    padding: 35px 7%;
    border-top: 1px solid #8885;
    font-size: 12px;
    opacity: 0.7;
}

@media (max-width: 700px) {

    header {
        padding: 18px 5%;
    }

    main {
        padding: 60px 5%;
    }

    .gallery {
        gap: 30px;
        margin-top: 50px;
    }

    .frame {
        min-height: 250px;
    }

    header .controls {
        gap: 6px;
    }

    button {
        padding: 8px 10px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html" id="back"></a>

    <div class="controls">

        <button id="theme" type="button"></button>

        <button id="lang" type="button">EN</button>

    </div>

</header>

<main>

    <div class="kicker">PHOTOGRAPHY SERIES / 01</div>

    <h1 id="title"></h1>

    <p class="intro" id="desc"></p>

    <div class="gallery">

        <div class="frame">
            <p id="p1"></p>
        </div>

        <div class="frame">
            <p id="p2"></p>
        </div>

        <div class="frame">
            <p id="p3"></p>
        </div>

    </div>

</main>

<footer id="foot"></footer>

<script>

let en = false;

/* Persian content */

const fa = {

    back: '← بازگشت به صفحه اصلی',

    theme: 'حالت روشن',

    title: 'آنچه بیرون قاب ماند',

    desc: 'این مجموعه میان مشاهده و تفسیر حرکت می‌کند؛ جایی که تصویر اطلاعاتی ناقص در اختیار ما می‌گذارد و ذهن، فاصله‌های میان آن‌ها را با داستان پر می‌کند. آنچه دیده نمی‌شود، شاید مهم‌ترین بخش روایت باشد؛ روایتی که در پایان تنها ردی از آن باقی می‌ماند، بی‌آنکه مبدأ یا مقصدش روشن باشد.',

    p1: 'جای عکس اول مجموعه',

    p2: 'جای عکس دوم مجموعه — قاب تیره',

    p3: 'جای عکس سوم مجموعه — زمینه روشن',

    foot: '© ۲۰۲۶ محمدرضا هادیان'

};


/* English content */

const eng = {

    back: '← Back to home',

    theme: 'Light mode',

    title: 'What Remained Outside the Frame',

    desc: 'This series moves between observation and interpretation, where the image offers incomplete information and the mind fills the gaps with a story. What remains unseen may be the most significant part of the narrative; in the end, only a trace remains, its origin and destination equally uncertain.',

    p1: 'Photograph 01 — placeholder',

    p2: 'Photograph 02 — dark frame',

    p3: 'Photograph 03 — light frame',

    foot: '© 2026 Mohammadreza Hadian'

};


/* Apply language */

function updateLanguage() {

    const content = en ? eng : fa;

    document.documentElement.lang = en ? 'en' : 'fa';

    document.documentElement.dir = en ? 'ltr' : 'rtl';

    for (const key of Object.keys(content)) {

        const element = document.getElementById(key);

        if (element) {

            element.textContent = content[key];

        }

    }

    document.getElementById('lang').textContent = en ? 'FA' : 'EN';

    document.title = en
        ? 'What Remained Outside the Frame — Mohammadreza Hadian'
        : 'آنچه بیرون قاب ماند — محمدرضا هادیان';

    updateThemeLabel();

}


/* Theme label */

function updateThemeLabel() {

    const isLight = document.body.classList.contains('light');

    document.getElementById('theme').textContent = isLight
        ? (en ? 'Dark mode' : 'حالت تیره')
        : (en ? 'Light mode' : 'حالت روشن');

}


/* Language button */

document.getElementById('lang').addEventListener('click', function() {

    en = !en;

    updateLanguage();

});


/* Theme button */

document.getElementById('theme').addEventListener('click', function() {

    const light = !document.body.classList.contains('light');

    document.body.classList.toggle('light', light);

    try {
        localStorage.setItem('hadian-theme', light ? 'light' : 'dark');
    } catch (error) {
        console.warn('Theme preference could not be saved.');
    }

    updateThemeLabel();

});


/* Restore saved theme */

try {

    const savedTheme = localStorage.getItem('hadian-theme');

    if (savedTheme === 'light') {

        document.body.classList.add('light');

    } else {

        document.body.classList.remove('light');

    }

} catch (error) {

    document.body.classList.remove('light');

}


/* Initial page setup */

updateLanguage();

</script>

</body>
</html>
