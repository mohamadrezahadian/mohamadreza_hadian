
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آنچه بیرون قاب ماند — محمدرضا هادیان</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111213;
    color: #eeeeee;
    font-family: Tahoma, Arial, sans-serif;
    transition: background .3s ease, color .3s ease;
}

body.light {
    background: #e9e7e2;
    color: #171717;
}

a {
    color: inherit;
    text-decoration: none;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 7%;
    border-bottom: 1px solid #8885;
    gap: 16px;
}

.controls {
    display: flex;
    gap: 10px;
}

button {
    background: none;
    border: 1px solid currentColor;
    color: inherit;
    padding: 10px 15px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .2s ease;
}

button:hover {
    opacity: .65;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 85px 7%;
}

.kicker {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: .6;
}

h1 {
    font-weight: 400;
    font-size: clamp(34px, 6vw, 76px);
    margin: 20px 0 26px;
    line-height: 1.5;
}

.intro {
    line-height: 2.2;
    max-width: 670px;
    opacity: .8;
    font-size: 14px;
}

.gallery {
    margin-top: 90px;
    display: flex;
    flex-direction: column;
    gap: 85px;
}

.photo {
    width: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.photo img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 85vh;
    object-fit: contain;
    cursor: zoom-in;
    transition: opacity .3s ease;
}

.photo img:hover {
    opacity: .92;
}

/* Lightbox */

.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .96);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 35px;
    z-index: 1000;
    cursor: zoom-out;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 100%;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
}

.close-lightbox {
    position: absolute;
    top: 20px;
    left: 25px;
    color: white;
    border: none;
    font-size: 32px;
    padding: 5px 12px;
    cursor: pointer;
}

footer {
    padding: 35px 7%;
    border-top: 1px solid #8885;
    font-size: 12px;
    opacity: .7;
}

/* Mobile */

@media (max-width: 700px) {
    header {
        padding: 18px 5%;
    }

    main {
        padding: 60px 5%;
    }

    .gallery {
        gap: 40px;
        margin-top: 55px;
    }

    .photo img {
        max-height: 75vh;
    }

    button {
        padding: 8px 10px;
        font-size: 11px;
    }

    .lightbox {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>

    <a href="index.html" id="back"></a>

    <div class="controls">
        <button id="theme" type="button"></button>
        <button id="lang" type="button">EN</button>
    </div>

</header>

<main>

    <div class="kicker">
        PHOTOGRAPHY SERIES / 01
    </div>

    <h1 id="title"></h1>

    <p class="intro" id="desc"></p>

    <div class="gallery" id="gallery"></div>

</main>

<footer id="foot"></footer>

<!-- Lightbox -->

<div class="lightbox" id="lightbox">

    <button
        class="close-lightbox"
        id="closeLightbox"
        type="button"
        aria-label="Close">
        &times;
    </button>

    <img id="lightboxImage" src="" alt="">

</div>

<script>

let en = false;

/* Persian content */

const fa = {
    back: '← بازگشت به صفحه اصلی',

    title: 'آنچه بیرون قاب ماند',

    desc: 'این مجموعه میان مشاهده و تفسیر حرکت می‌کند؛ جایی که تصویر اطلاعاتی ناقص در اختیار ما می‌گذارد و ذهن، فاصله‌های میان آن‌ها را با داستان پر می‌کند. آنچه دیده نمی‌شود، شاید مهم‌ترین بخش روایت باشد؛ روایتی که در پایان تنها ردی از آن باقی می‌ماند، بی‌آنکه مبدأ یا مقصدش روشن باشد.',

    foot: '© ۲۰۲۶ محمدرضا هادیان'
};

/* English content */

const eng = {
    back: '← Back to home',

    title: 'What Remained Outside the Frame',

    desc: 'This series moves between observation and interpretation, where the image offers incomplete information and the mind fills the gaps with a story. What remains unseen may be the most significant part of the narrative; in the end, only a trace remains, its origin and destination equally uncertain.',

    foot: '© 2026 Mohammadreza Hadian'
};


/* IMAGE PATH */

const imageFolder = 'images/outside-the-frame/';


/* Generate 20 photographs */

const gallery = document.getElementById('gallery');

for (let i = 1; i <= 20; i++) {

    const figure = document.createElement('figure');

    figure.className = 'photo';

    const img = document.createElement('img');

    img.src = imageFolder + i + '.jpg';

    img.alt = 'Photograph ' + i;

    img.loading = i <= 2 ? 'eager' : 'lazy';

    img.decoding = 'async';

    /* Open image */

    img.addEventListener('click', function() {

        const lightbox = document.getElementById('lightbox');

        const lightboxImage = document.getElementById('lightboxImage');

        lightboxImage.src = this.src;

        lightboxImage.alt = this.alt;

        lightbox.classList.add('active');

    });

    /* Report missing image */

    img.addEventListener('error', function() {

        console.error('Image not found:', this.src);

    });

    figure.appendChild(img);

    gallery.appendChild(figure);

}


/* Language */

function updateLanguage() {

    const content = en ? eng : fa;

    document.documentElement.lang = en ? 'en' : 'fa';

    document.documentElement.dir = en ? 'ltr' : 'rtl';

    document.getElementById('back').textContent = content.back;

    document.getElementById('title').textContent = content.title;

    document.getElementById('desc').textContent = content.desc;

    document.getElementById('foot').textContent = content.foot;

    document.getElementById('lang').textContent = en ? 'FA' : 'EN';

    document.title = en
        ? 'What Remained Outside the Frame — Mohammadreza Hadian'
        : 'آنچه بیرون قاب ماند — محمدرضا هادیان';

    updateThemeLabel();

}


/* Theme label */

function updateThemeLabel() {

    const light = document.body.classList.contains('light');

    document.getElementById('theme').textContent = light
        ? (en ? 'Dark mode' : 'حالت تیره')
        : (en ? 'Light mode' : 'حالت روشن');

}


/* Language button */

document.getElementById('lang').addEventListener('click', function() {

    en = !en;

    updateLanguage();

});


/* Theme button */

document.getElementById('theme').addEventListener('click', function() {

    const light = !document.body.classList.contains('light');

    document.body.classList.toggle('light', light);

    try {

        localStorage.setItem(
            'hadian-theme',
            light ? 'light' : 'dark'
        );

    } catch (error) {

        console.warn('Theme preference could not be saved.');

    }

    updateThemeLabel();

});


/* Restore saved theme */

try {

    if (localStorage.getItem('hadian-theme') === 'light') {

        document.body.classList.add('light');

    }

} catch (error) {

    console.warn('Saved theme could not be restored.');

}


/* Lightbox controls */

const lightbox = document.getElementById('lightbox');

const lightboxImage = document.getElementById('lightboxImage');


/* Close button */

document.getElementById('closeLightbox').addEventListener('click', function() {

    lightbox.classList.remove('active');

    lightboxImage.src = '';

});


/* Close by clicking outside image */

lightbox.addEventListener('click', function(event) {

    if (event.target === lightbox) {

        lightbox.classList.remove('active');

        lightboxImage.src = '';

    }

});


/* Close with Escape key */

document.addEventListener('keydown', function(event) {

    if (event.key === 'Escape') {

        lightbox.classList.remove('active');

        lightboxImage.src = '';

    }

});


/* Initial setup */

updateLanguage();

</script>

</body>
</html>
